<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BetterDesk Session</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent !important;
        overflow: hidden;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .border {
        position: fixed;
        inset: 0;
        border-style: solid;
        border-width: 6px;
        box-sizing: border-box;
        pointer-events: none;
        animation: pulse 2s ease-in-out infinite;
      }
      .border.supervised {
        border-color: #d97706; /* amber-600 */
        box-shadow: inset 0 0 32px rgba(217, 119, 6, 0.55);
      }
      .border.unattended {
        border-color: #dc2626; /* red-600 */
        box-shadow: inset 0 0 36px rgba(220, 38, 38, 0.65);
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.85; }
        50%      { opacity: 1.0;  }
      }
    </style>
  </head>
  <body>
    <div id="b" class="border supervised" aria-hidden="true"></div>
    <script>
      // Pick supervised/unattended class from `?mode=...` so the same
      // overlay window can be reused for both colours by Rust without
      // reloading the page (we toggle via location.replace if needed).
      (function () {
        var params = new URLSearchParams(window.location.search);
        var mode = (params.get("mode") || "supervised").toLowerCase();
        var el = document.getElementById("b");
        if (!el) return;
        el.classList.remove("supervised", "unattended");
        el.classList.add(mode === "unattended" ? "unattended" : "supervised");
      })();
    </script>
  </body>
</html>
