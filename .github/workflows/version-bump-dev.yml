# =============================================================================
# BetterDesk — automatic patch version bump on dev branch
# =============================================================================
# Every push to dev (except [version-bump] commits and bot merge commits) bumps
# product version +0.0.1 via scripts/bump-version.js. Uses a PR because dev
# branch protection requires status checks before direct pushes.
# =============================================================================

name: Version Bump (dev)

on:
  push:
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-patch:
    # Skip version-bump commits and bot merges of bump PRs (prevents loops).
    if: >-
      !contains(github.event.head_commit.message, '[version-bump]') &&
      !(github.actor == 'github-actions[bot]' && contains(github.event.head_commit.message, 'Merge pull request'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump patch version
        id: bump
        run: |
          node scripts/bump-version.js --patch
          NEW_VERSION=$(cat VERSION | tr -d '\n')
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Open and merge version bump PR
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION web-nodejs/package.json betterdesk.sh betterdesk.ps1 betterdesk-docker.sh \
            CHANGELOG.md README.md Dockerfile Dockerfile.server Dockerfile.console \
            docker-compose.quick.yml docker/entrypoint.sh docker-entrypoint.sh
          if git diff --cached --quiet; then
            echo "No version files changed — skipping commit"
            exit 0
          fi
          BRANCH="bump/v${NEW_VERSION}"
          git checkout -b "$BRANCH"
          git commit -m "chore: bump version to ${NEW_VERSION} [version-bump]"
          git push -u origin "$BRANCH"
          gh pr create --base dev --head "$BRANCH" \
            --title "chore: bump version to ${NEW_VERSION}" \
            --body "Automated patch version bump on dev."
          gh pr merge --merge --admin --delete-branch
