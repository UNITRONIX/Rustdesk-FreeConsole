name: support-agent

on:
  push:
    paths:
      - 'betterdesk-support-agent/**'
      - 'betterdesk-agent/**'
  pull_request:
    paths:
      - 'betterdesk-support-agent/**'
      - 'betterdesk-agent/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install Fyne/CGO deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev gcc
      - name: Test betterdesk-agent
        working-directory: betterdesk-agent
        run: go test ./...
      - name: Test support-agent
        working-directory: betterdesk-support-agent
        env:
          CGO_ENABLED: '1'
        run: go test ./...
      - name: Smoke build support-agent
        working-directory: betterdesk-support-agent
        env:
          CGO_ENABLED: '1'
        run: ./build.sh -o /tmp/betterdesk-support-smoke
