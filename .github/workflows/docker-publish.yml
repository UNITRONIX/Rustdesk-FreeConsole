# =============================================================================
# BetterDesk Docker Images - Build & Publish to GitHub Container Registry
# =============================================================================
# Images:
#   ghcr.io/<owner>/betterdesk-server
#   ghcr.io/<owner>/betterdesk-console
#   ghcr.io/<owner>/betterdesk          (all-in-one)
#
# Tags:
#   - main push: latest, sha-<commit>
#   - dev push:  dev, sha-<commit>
#   - git tag v* / GitHub Release (stable): semver, v*, major.minor, latest
#   - workflow_dispatch: latest + VERSION when tag empty/latest; else custom tag
#
# Branch pushes (main/dev): build ONLY on [version-bump] commits so GHCR image
# VERSION matches tip (auto-bump runs after the feature commit; building the
# feature SHA left :dev/:latest one patch behind — #401). Feature commits skip.
# Tag pushes, release, and workflow_dispatch always build.
#
# AIO on dev branch pushes: linux/amd64 only (multi-arch AIO often hit the 6h
# Actions limit). Console/server stay multi-arch; main/tags/release/dispatch
# keep full amd64+arm64 for AIO.
#
# Triggers: push main/dev (path-filtered), push tag v*, release published, manual
# =============================================================================

name: Build & Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (empty or latest = push latest + VERSION; else custom tag)'
        required: false
        default: 'latest'
        type: string

  push:
    branches: [main, dev]
    tags: ['v*']
    paths:
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - 'docker/**'
      - 'betterdesk-server/**'
      - 'web-nodejs/**'
      - '.github/workflows/docker-publish.yml'
      - 'VERSION'

  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  read-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: ver
        run: |
          if [ -f VERSION ]; then
            echo "version=$(tr -d '\n\r' < VERSION)" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

  build-server:
    needs: read-version
    # Release/dispatch/tags always; branch pushes only on [version-bump] (#401).
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[version-bump]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      json: ${{ steps.meta.outputs.json }}

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/betterdesk-server
          # Prefer product VERSION over tag name (dispatch with tag=latest must not label as "latest")
          labels: |
            org.opencontainers.image.version=${{ needs.read-version.outputs.version }}
          tags: |
            type=raw,value=latest,enable=${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'release' && github.event.release.prerelease == false) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.tag == '' || github.event.inputs.tag == 'latest')) }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' && github.event_name == 'push' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') && (github.event_name != 'workflow_dispatch' || !contains(github.event.inputs.tag, '-')) }}
            type=raw,value=${{ needs.read-version.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tag == '' || github.event.inputs.tag == 'latest') }}
            type=raw,value=v${{ needs.read-version.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tag == '' || github.event.inputs.tag == 'latest') }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag != 'latest' }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

      - name: Resolve image for SBOM/Trivy
        id: scanref
        run: |
          tag_line="$(echo "${{ steps.meta.outputs.tags }}" | grep -m1 'betterdesk-server:' || true)"
          if [ -z "$tag_line" ]; then
            tag_line="${{ env.IMAGE_PREFIX }}/betterdesk-server:latest"
          fi
          echo "image=$tag_line" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BETTERDESK_COMMIT_SHA=${{ github.sha }}
            BETTERDESK_IMAGE_VERSION=${{ needs.read-version.outputs.version }}
            BETTERDESK_PRODUCT_VERSION=${{ needs.read-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate SBOM
        continue-on-error: true
        uses: anchore/sbom-action@v0
        env:
          SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image: ${{ steps.scanref.outputs.image }}
          format: spdx-json
          output-file: sbom-server.spdx.json

      - name: Trivy vulnerability scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.scanref.outputs.image }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  build-console:
    needs: read-version
    # Release/dispatch/tags always; branch pushes only on [version-bump] (#401).
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[version-bump]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/betterdesk-console
          labels: |
            org.opencontainers.image.version=${{ needs.read-version.outputs.version }}
          tags: |
            type=raw,value=latest,enable=${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'release' && github.event.release.prerelease == false) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.tag == '' || github.event.inputs.tag == 'latest')) }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' && github.event_name == 'push' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') && (github.event_name != 'workflow_dispatch' || !contains(github.event.inputs.tag, '-')) }}
            type=raw,value=${{ needs.read-version.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tag == '' || github.event.inputs.tag == 'latest') }}
            type=raw,value=v${{ needs.read-version.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tag == '' || github.event.inputs.tag == 'latest') }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag != 'latest' }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.console
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BETTERDESK_COMMIT_SHA=${{ github.sha }}
            BETTERDESK_IMAGE_VERSION=${{ needs.read-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  build-allinone:
    needs: read-version
    # Release/dispatch/tags always; branch pushes only on [version-bump] (#401).
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[version-bump]'))
    runs-on: ubuntu-latest
    # Multi-arch AIO on dev has hit the 6h Actions limit (#401); fail sooner if stuck.
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve AIO platforms
        id: plats
        run: |
          # Dev branch pushes: amd64 only (faster :dev republish). Full multi-arch
          # on main, tags, release, and workflow_dispatch.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/betterdesk
          labels: |
            org.opencontainers.image.version=${{ needs.read-version.outputs.version }}
          tags: |
            type=raw,value=latest,enable=${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'release' && github.event.release.prerelease == false) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.tag == '' || github.event.inputs.tag == 'latest')) }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' && github.event_name == 'push' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') && (github.event_name != 'workflow_dispatch' || !contains(github.event.inputs.tag, '-')) }}
            type=raw,value=${{ needs.read-version.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tag == '' || github.event.inputs.tag == 'latest') }}
            type=raw,value=v${{ needs.read-version.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tag == '' || github.event.inputs.tag == 'latest') }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag != 'latest' }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BETTERDESK_COMMIT_SHA=${{ github.sha }}
            BETTERDESK_IMAGE_VERSION=${{ needs.read-version.outputs.version }}
            BETTERDESK_PRODUCT_VERSION=${{ needs.read-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ steps.plats.outputs.platforms }}

  update-description:
    needs: [build-server, build-console, build-allinone]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build-server.result == 'success' &&
      needs.build-console.result == 'success' &&
      needs.build-allinone.result == 'success'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Summary
        env:
          SERVER_TAGS: ${{ needs.build-server.outputs.tags }}
          CONSOLE_TAGS: ${{ needs.build-console.outputs.tags }}
          ALLINONE_TAGS: ${{ needs.build-allinone.outputs.tags }}
        run: |
          extract_tags() {
            echo "$1" | sed -n 's/.*:\([^ ]*\)$/\1/p' | sort -u | paste -sd ', ' -
          }
          server_tags="$(extract_tags "$SERVER_TAGS")"
          console_tags="$(extract_tags "$CONSOLE_TAGS")"
          allinone_tags="$(extract_tags "$ALLINONE_TAGS")"
          pin_ver="$(tr -d '\n\r' < VERSION 2>/dev/null || echo VERSION)"

          {
            echo "## Docker images published"
            echo ""
            echo "| Image | Tags |"
            echo "|-------|------|"
            echo "| \`ghcr.io/${{ github.repository_owner }}/betterdesk-server\` | ${server_tags:-n/a} |"
            echo "| \`ghcr.io/${{ github.repository_owner }}/betterdesk-console\` | ${console_tags:-n/a} |"
            echo "| \`ghcr.io/${{ github.repository_owner }}/betterdesk\` | ${allinone_tags:-n/a} |"
            echo ""
            echo "### Pin a version (production — recommended)"
            echo "\`\`\`bash"
            echo "export BETTERDESK_IMAGE_TAG=${pin_ver}"
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.quick.single.yml -o docker-compose.yml"
            echo "docker compose pull"
            echo "docker compose up -d"
            echo "\`\`\`"
            echo ""
            echo "### Rolling stable tip (\`latest\` = last successful stable image publish)"
            echo "\`\`\`bash"
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.quick.single.yml -o docker-compose.yml"
            echo "BETTERDESK_IMAGE_TAG=latest docker compose up -d"
            echo "\`\`\`"
            echo ""
            echo "### Legacy split layout (two images)"
            echo "\`\`\`bash"
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.quick.yml -o docker-compose.yml"
            echo "docker compose pull && docker compose up -d"
            echo "\`\`\`"
            echo ""
            echo "### Package visibility"
            echo "New GHCR packages default to **private**. Set each package to **Public** for unauthenticated pulls."
          } >> "$GITHUB_STEP_SUMMARY"
